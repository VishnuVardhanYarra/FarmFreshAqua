# Render Infrastructure Blueprint for FarmFreshAqua
# Deploys:
#   1. Managed PostgreSQL Database
#   2. FastAPI Backend Web Service (Docker)
#   3. React Vite Frontend (Free Global Static Site CDN)

services:
  # --- 1. FastAPI Backend API ---
  - type: web
    name: farmfresh-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farmfresh-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://farmfresh-frontend.onrender.com,http://localhost:3000

  # --- 2. React + Vite Frontend (Free Static Site) ---
  - type: web
    name: farmfresh-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: farmfresh-backend
          property: host

databases:
  # --- 3. Managed PostgreSQL Database ---
  - name: farmfresh-db
    plan: free
    databaseName: disease_app
    user: farmfresh_user
